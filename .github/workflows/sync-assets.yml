name: Sync assets to CDN

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "squid-brand-assets/**"
      - "scripts/update-tokens/colors.json"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-assets
      cancel-in-progress: false
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      BUCKET: r2:squid-assets
    steps:
      - uses: actions/checkout@v5
        with:
          # When called from update-tokens, github.sha is the commit before the
          # cron's push. Sync what is on main now.
          ref: main

      - name: Install rclone
        env:
          RCLONE_VERSION: v1.75.1
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/rclone.zip" \
            "https://downloads.rclone.org/$RCLONE_VERSION/rclone-$RCLONE_VERSION-linux-amd64.zip"
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/rclone-$RCLONE_VERSION-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Sync to R2
        run: |
          set -euo pipefail
          sync() {
            rclone sync "$1" "$BUCKET/$2" \
              --checksum \
              --exclude .DS_Store \
              --header-upload "Cache-Control: public, max-age=86400" \
              -v 2>&1 | tee "$RUNNER_TEMP/rclone-$3.log"
          }
          sync images images images
          sync squid-brand-assets squid-brand-assets squid-brand-assets
          sync scripts/update-tokens/colors.json scripts/update-tokens colors

      - name: Purge changed URLs from the Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          purge() {
            bash scripts/sync/purge-list.sh "$1" < "$RUNNER_TEMP/rclone-$2.log" \
            | while IFS= read -r body; do
                echo "Purging: $body"
                response=$(curl -sS -X POST \
                  "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
                  -H "Authorization: Bearer $CF_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data "$body")
                echo "$response" | jq -e '.success == true' >/dev/null || {
                  echo "Purge failed: $response"
                  exit 1
                }
              done
          }
          purge images images
          purge squid-brand-assets squid-brand-assets
          purge scripts/update-tokens colors
